name: Build Minimal MuPDF WASM

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mupdf-wasm:
    runs-on: ubuntu-latest

    env:
      EM_VERSION: '4.0.8'
      EM_CACHE_FOLDER: 'emsdk-cache'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Emscripten system libraries
        uses: actions/cache@v4
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: emsdk-${{ env.EM_VERSION }}-${{ runner.os }}

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}

      - name: Clone MuPDF source
        run: |
          git clone --recursive https://github.com/ArtifexSoftware/mupdf.git
          cd mupdf
          git submodule update --init --recursive

      - name: Build minimal MuPDF WASM
        run: |
          cd mupdf/platform/wasm

          # Minimal build flags
          export EMSDK="${RUNNER_TOOL_CACHE}/emsdk"  
          export BUILD=small
          export DEFINES="-DTOFU -DTOFU_CJK_EXT -DFZ_ENABLE_ICC=0 -DFZ_ENABLE_JS=0"
          export FEATURES="brotli=no mujs=no extract=no xps=no svg=no html=no epub=no cbz=no img=no"
          export SUFFIX="_minimal"

          # Skip emcc sanity checks
          export EMCC_SKIP_SANITY_CHECK=1
          export EM_IGNORE_SANITY=1

          # Run the build
          ./tools/build.sh

      - name: List build artifacts
        run: |
          ls -la mupdf/platform/wasm/dist/
          echo "File sizes:"
          du -h mupdf/platform/wasm/dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mupdf-wasm-minimal
          path: |
            mupdf/platform/wasm/dist/mupdf-wasm.wasm
            mupdf/platform/wasm/dist/mupdf-wasm.js
            mupdf/platform/wasm/dist/mupdf.js
            mupdf/platform/wasm/dist/mupdf-wasm.d.ts
          retention-days: 30
